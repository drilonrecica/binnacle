# Binnacle on plain HTTP behind a TLS-terminating Caddy, on a network with a
# fixed subnet so the trusted-proxy CIDR is known. Driven by
# scripts/e2e-tls-proxy.sh; not a deployment template.
services:
  proxy:
    image: docker.io/library/caddy:2.10.0
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
    depends_on:
      - binnacle
    networks:
      - e2e

  binnacle:
    image: ${BINNACLE_IMAGE:-localhost/binnacle:e2e}
    command: ["--demo"]
    environment:
      BINNACLE_SETUP_TOKEN: ${BINNACLE_SETUP_TOKEN:?set by the script}
      BINNACLE_PUBLIC_URL: ${BINNACLE_PUBLIC_URL:-}
      BINNACLE_TRUSTED_PROXY_CIDRS: ${BINNACLE_TRUSTED_PROXY_CIDRS:-}
    networks:
      - e2e

networks:
  e2e:
    ipam:
      config:
        - subnet: 10.77.0.0/24
