name: release
on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Dry-run version/channel validation
        run: |
          set -euo pipefail
          scripts/validate-version.sh v0.1.0-alpha.1 | grep 'channel=edge'
          scripts/validate-version.sh v0.1.0-beta.1 | grep 'channel=beta'
          scripts/validate-version.sh v0.1.0 | grep 'channel=stable'
          ! scripts/validate-version.sh v0.1.0-alpha.1 | grep 'channel=stable'
          ! scripts/validate-version.sh invalid-tag

  qualify:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with: { go-version: '1.26.x', check-latest: true }
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with: { node-version: 24 }
      - run: npm install -g pnpm@11.12.0
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Run release qualification
        run: VERSION="${GITHUB_REF_NAME:-v0.3.0}" ./scripts/release-gate.sh
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: release-qualification-${{ github.sha }}
          path: |
            release-record/
            benchmark-report.json
            benchmark-report.md

  publish:
    needs: [validate, qualify]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Validate version
        id: version
        run: scripts/validate-version.sh "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          build-args: VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/binnacle:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/binnacle:${{ steps.version.outputs.channel }}
      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/binnacle
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
